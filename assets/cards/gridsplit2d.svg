<svg xmlns="http://www.w3.org/2000/svg" width="410" height="158" viewBox="0 0 410 158" role="img" aria-label="GRIDSPLIT2D: slices 2d sprite sheets into tiles and zips them, right in the browser.">
<style>
 .t{font-family:ui-monospace, 'Cascadia Mono', Consolas, 'SF Mono', Menlo, 'Liberation Mono', monospace;fill:#cdeedb} .dim{fill:#5f8a72}

name: Generate Snake

on:
  schedule:
    # Her 12 saatte bir çalışır
    - cron: "0 */12 * * *"
  # Actions sekmesinden manuel çalıştırma
  workflow_dispatch:
  # README'ye push gelince de yeniden üret
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    # Botun output dalına yazabilmesi için gereken yetki
    permissions:
      contents: write

    steps:
      - name: Generate Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: mhmtemnbgr1
          # Retro fosfor paleti: koyu yeşil ızgara, yeşil tonlar, turuncu yılan
          outputs: |
            dist/snake-retro.svg?color_snake=#ffb627&color_dots=#0d1f15,#0f4d2a,#1a8a48,#2bcf68,#3dff7f&color_dot_border=#050a07
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Generate Snake

on:
  schedule:
    # Her 12 saatte bir çalışır
    - cron: "0 */12 * * *"
  # Actions sekmesinden manuel çalıştırma
  workflow_dispatch:
  # README'ye push gelince de yeniden üret
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    # Botun output dalına yazabilmesi için gereken yetki
    permissions:
      contents: write

    steps:
      - name: Generate Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: mhmtemnbgr1
          # Retro arcade paleti: koyu ızgara, mor -> pembe -> turuncu -> camgöbeği, yeşil yılan
          outputs: |
            dist/snake-retro.svg?color_snake=#39ff88&color_dots=#151c33,#4b2a7a,#ff4fa3,#ffb627,#2de2ff&color_dot_border=#0a0f1f
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
